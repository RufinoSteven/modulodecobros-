###Extent Report
#extent.reporter.spark.start=true
#extent.reporter.spark.out=Reports/Spark.html
#HTML Report
extent.reporter.html.start=true
extent.reporter.html.out=reports/ExtentHtml.html
# XML test report file name
extent.reporter.xml.start=true
extent.reporter.xml.out=XmlReport/Extent.xml
extent.reporter.xml.addTestDetails=true
extent.reporter.xml.addSystemInfo=true
extent.reporter.xml.showExceptionMessages=true
#Base64
extent.reporter.spark.base64imagesrc=true
# Theme
extent.reporter.html.theme=dark
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log
systeminfo.OS=${os.name}
systeminfo.Java=${java.version}
systeminfo.Selenium=${selenium.version}
systeminfo.Cucumber=${cucumber.version}
